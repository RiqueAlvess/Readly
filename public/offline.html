<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Readly — Offline</title>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#1F2D26; color:#F7EAE6; font-family:system-ui,sans-serif; text-align:center; padding:24px; }
  .icon { font-size:64px; margin-bottom:16px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:#A9B8AE; max-width:320px; }
  button { margin-top:24px; background:#D4A89C; color:#1F2D26; border:none; padding:12px 24px;
    border-radius:16px; font-weight:600; font-size:15px; }
</style>
</head>
<body>
  <div class="icon">📚</div>
  <h1>Você está offline</h1>
  <p>Suas atualizações foram salvas e serão sincronizadas quando a conexão voltar.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</body>
</html>
